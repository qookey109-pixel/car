name: Sanchong Luzhou River Bridge Visual V0721 Validation

on:
  pull_request:
    paths:
      - 'experiments/real-world-raycast-v0.7.2-sanchong-luzhou-river-bridges/**'
      - 'tests/sanchong-luzhou-river-bridge-visual-v0721-validation.mjs'
      - '.github/workflows/sanchong-luzhou-river-bridge-visual-v0721-validation.yml'
      - 'experiments/real-world-raycast-v0.7.1-sanchong-luzhou-streetscape/**'
      - 'experiments/real-world-raycast-v0.7-sanchong-luzhou-city/**'
      - 'experiments/real-world-raycast-v0.6-sanchong-luzhou/**'
  workflow_dispatch:

jobs:
  chromium-sanchong-luzhou-river-bridge-visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 8011 > /tmp/car-http.log 2>&1 &
          sleep 2
      - name: Run V0.7.2.1 river and bridge visual smoke
        run: node tests/sanchong-luzhou-river-bridge-visual-v0721-validation.mjs
