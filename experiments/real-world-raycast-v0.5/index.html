<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#061018">
<title>Car — Real World Raycast V0.5</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061018;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}canvas{display:block}
#hud{position:fixed;z-index:8;left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));padding:10px 12px;border-radius:14px;background:rgba(3,8,13,.74);backdrop-filter:blur(10px);max-width:min(760px,calc(100vw - 20px));box-shadow:0 10px 30px rgba(0,0,0,.3)}
#hud h1{font-size:15px;margin:0 0 7px}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.chip{font-size:10px;padding:5px 8px;border:1px solid rgba(255,255,255,.14);border-radius:999px;background:rgba(255,255,255,.07)}.good{color:#8affd6;border-color:rgba(83,255,205,.34)}.warn{color:#ffe27b;border-color:rgba(255,215,83,.44)}.bad{color:#ffaaaa;border-color:rgba(255,112,112,.42)}
#mapRow{margin-top:7px}#mapRow input{width:104px;border:1px solid rgba(255,255,255,.18);border-radius:8px;background:#111a24;color:#fff;padding:6px 7px;font-size:10px}#mapRow button{border:0;border-radius:8px;padding:7px 9px;font-size:10px;font-weight:800;background:#fff;color:#111}#status{font-size:10px;opacity:.82;margin-top:6px;line-height:1.4}#help{font-size:10px;opacity:.72;margin-top:6px;line-height:1.4}
#touch{position:fixed;z-index:9;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;padding:0 max(14px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left));pointer-events:none}.pad,.actions{pointer-events:auto;display:grid;gap:9px}.pad{grid-template-columns:repeat(2,64px)}.actions{grid-template-columns:repeat(2,70px);grid-template-rows:repeat(2,58px)}#touch button{border:1px solid rgba(255,255,255,.24);border-radius:17px;background:rgba(14,20,29,.78);color:#fff;font-weight:900;touch-action:none;-webkit-tap-highlight-color:transparent;backdrop-filter:blur(8px)}.pad button{height:92px;font-size:26px}.actions button{font-size:10px}.gas{color:#9bffe8!important;border-color:rgba(76,255,211,.42)!important}.brake{color:#ffaaaa!important;border-color:rgba(255,112,112,.42)!important}.drift{color:#ffe27b!important;border-color:rgba(255,215,83,.44)!important}.reset{color:#9fd6ff!important;border-color:rgba(90,175,255,.44)!important}button.active,button:active{transform:scale(.95);filter:brightness(1.2)}
#loading{position:fixed;z-index:20;inset:0;display:none;place-items:center;background:rgba(3,7,11,.56);font-weight:900;backdrop-filter:blur(4px)}#loading.show{display:grid}
@media(max-width:760px){#hud{padding:9px}#hud h1{font-size:12px}#help{display:none}#mapRow{display:none}.pad{grid-template-columns:repeat(2,56px)}.pad button{width:56px;height:78px}.actions{grid-template-columns:repeat(2,60px);grid-template-rows:repeat(2,50px)}.actions button{font-size:9px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js","cannon-es":"https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"}}</script>
</head>
<body>
<div id="hud">
  <h1>🌏🏎️ Real World Raycast V0.5</h1>
  <div class="row"><span class="chip" id="speed">0 km/h</span><span class="chip good" id="grounded">輪胎接地 0/4</span><span class="chip" id="slip">滑移 0°</span><span class="chip" id="suspension">懸吊 0%</span><span class="chip" id="state">GRIP</span><span class="chip" id="fps">FPS --</span><span class="chip good" id="surface">道路</span><span class="chip" id="roadDistance">中心線 -- m</span><span class="chip" id="source">OSM --</span></div>
  <div class="row" id="mapRow"><label>Lat <input id="lat" value="25.033964"></label><label>Lon <input id="lon" value="121.564468"></label><button id="loadRoads">載入道路</button></div>
  <div id="status">V5 RaycastVehicle + 真實 OSM 道路整合。預設台北 101 周邊。</div>
  <div id="help">W/↑ 油門｜S/↓ 煞車｜A/D 轉向｜Space DRIFT｜R 重置。這輪不做交通規則；先驗證道路貼合、路肩/離路阻力與四輪懸吊。</div>
</div>
<div id="touch"><div class="pad"><button data-action="left">◀</button><button data-action="right">▶</button></div><div class="actions"><button class="drift" data-action="drift">DRIFT</button><button class="reset" data-action="reset">RESET</button><button class="brake" data-action="brake">BRAKE</button><button class="gas" data-action="gas">GAS</button></div></div>
<div id="loading">正在載入 OpenStreetMap 道路…</div>
<script type="module" src="./app.js"></script>
</body>
</html>
