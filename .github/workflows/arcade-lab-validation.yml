name: Arcade Lab Validation

on:
  push:
    branches:
      - feature/real-world-road-v0.4-arcade-ai
  workflow_dispatch:

jobs:
  chromium-gameplay-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Start local HTTP server
        run: |
          python3 -m http.server 8011 > /tmp/car-http.log 2>&1 &
          echo $! > /tmp/car-http.pid
          sleep 2
      - name: Run desktop and mobile gameplay smoke
        run: node tests/arcade-lab-validation.mjs
      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcade-lab-validation
          path: artifacts/arcade-validation/
          if-no-files-found: warn
