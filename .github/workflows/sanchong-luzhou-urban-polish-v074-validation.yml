name: Sanchong Luzhou Urban Polish V074 Validation

on:
  pull_request:
    branches:
      - feature/real-world-raycast-v0.7.3-taiwan-urban-identity
    paths:
      - 'experiments/real-world-raycast-v0.7.4-sanchong-luzhou-urban-polish/**'
      - 'tests/sanchong-luzhou-urban-polish-v074-validation.mjs'
      - '.github/workflows/sanchong-luzhou-urban-polish-v074-validation.yml'

jobs:
  chromium-sanchong-luzhou-urban-polish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Start local servers
        run: |
          python3 -m http.server 8011 > /tmp/car-http-8011.log 2>&1 &
          python3 -m http.server 8012 > /tmp/car-http-8012.log 2>&1 &
          python3 -m http.server 8013 > /tmp/car-http-8013.log 2>&1 &
          sleep 2
      - name: Run V0.7.2.2 regression
        run: node tests/sanchong-luzhou-river-performance-v0722-validation.mjs
      - name: Run V0.7.3 regression
        run: node tests/sanchong-luzhou-urban-identity-v073-validation.mjs
      - name: Run V0.7.4 urban polish smoke
        run: node tests/sanchong-luzhou-urban-polish-v074-validation.mjs
