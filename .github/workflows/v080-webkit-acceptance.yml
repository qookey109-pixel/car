name: V0.8.0 WebKit Acceptance

on:
  push:
    branches:
      - preview/v0.8.0-validated-76e9378
    paths:
      - .github/workflows/v080-webkit-acceptance.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Checkout exact validated V0.8.0 candidate
        uses: actions/checkout@v6
        with:
          ref: 76e9378ce01941caabe68555d2c0f83055c6980b

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Static smoke
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install WebKit
        run: npx playwright install --with-deps webkit

      - name: Prepare WebKit contracts from exact validated tests
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for src in ['browser-smoke.mjs','objective-compass-smoke.mjs','audio-feel-smoke.mjs']:
              p = Path('tests') / src
              out = Path('tests') / src.replace('.mjs','-webkit.tmp.mjs')
              s = p.read_text()
              s = s.replace("import {chromium} from '@playwright/test';", "import {webkit as chromium} from '@playwright/test';")
              s = re.sub(r"chromium\.launch\(\{headless:true,args:\[[^\]]*\]\}\)", "chromium.launch({headless:true})", s)
              out.write_text(s)
          PY
          grep -q "webkit as chromium" tests/browser-smoke-webkit.tmp.mjs
          grep -q "webkit as chromium" tests/objective-compass-smoke-webkit.tmp.mjs
          grep -q "webkit as chromium" tests/audio-feel-smoke-webkit.tmp.mjs

      - name: Prepare WebKit frame pacing telemetry
        run: |
          cat > tests/webkit-frame-pacing.tmp.mjs <<'EOF'
          import {webkit} from '@playwright/test';
          import fs from 'node:fs';
          const base=process.env.BASE_URL||'http://127.0.0.1:4173/';
          fs.mkdirSync('test-results/webkit-frame-pacing',{recursive:true});
          const browser=await webkit.launch({headless:true});
          try{
            const page=await browser.newPage({viewport:{width:844,height:390},isMobile:true,hasTouch:true});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            await page.goto(base,{waitUntil:'networkidle'});
            await page.waitForFunction(()=>window.__NEON_RACER__?.snapshot?.().version==='0.8.0');
            await page.click('#startGame');
            await page.waitForFunction(()=>window.__NEON_RACER__.snapshot().state==='running');
            await page.keyboard.down('KeyW');
            await page.waitForTimeout(600);
            const sample=await page.evaluate(()=>new Promise(resolve=>{
              const deltas=[];let last=performance.now(),start=last,frames=0;
              const tick=now=>{
                deltas.push(now-last);last=now;frames++;
                if(now-start>=5000){
                  const sorted=deltas.slice(1).sort((a,b)=>a-b);
                  const pct=p=>sorted[Math.min(sorted.length-1,Math.floor(sorted.length*p))]||0;
                  resolve({frames,elapsedMs:now-start,avgFps:frames/((now-start)/1000),p50Ms:pct(.50),p95Ms:pct(.95),p99Ms:pct(.99),maxMs:sorted.at(-1)||0,snapshot:window.__NEON_RACER__.snapshot()});
                }else requestAnimationFrame(tick);
              };
              requestAnimationFrame(tick);
            }));
            await page.keyboard.up('KeyW');
            fs.writeFileSync('test-results/webkit-frame-pacing/frame-pacing.json',JSON.stringify(sample,null,2));
            await page.screenshot({path:'test-results/webkit-frame-pacing/mobile-driving.png',animations:'disabled'});
            if(errors.length)throw new Error(errors.join('\n'));
            console.log(`WebKit telemetry · ${sample.avgFps.toFixed(1)} FPS · p95 ${sample.p95Ms.toFixed(1)} ms · CI headless only, not real Safari acceptance`);
          }finally{await browser.close()}
          EOF

      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/car-v080-webkit-vite.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/car-v080-webkit-vite.log
          exit 1

      - name: WebKit game-loop acceptance
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: node tests/browser-smoke-webkit.tmp.mjs

      - name: WebKit objective compass acceptance
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: node tests/objective-compass-smoke-webkit.tmp.mjs

      - name: WebKit audio graph acceptance
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: node tests/audio-feel-smoke-webkit.tmp.mjs

      - name: WebKit frame pacing telemetry
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: node tests/webkit-frame-pacing.tmp.mjs

      - name: Upload WebKit QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v080-webkit-qa-76e9378
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  software-low-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout exact validated V0.8.0 candidate
        uses: actions/checkout@v6
        with:
          ref: 76e9378ce01941caabe68555d2c0f83055c6980b

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Production build
        run: npm run build

      - name: Install Chromium SwiftShader
        run: npx playwright install --with-deps chromium

      - name: Prepare active software LOW budget gate
        run: |
          cat > tests/software-low-active-budget.tmp.mjs <<'EOF'
          import {chromium} from '@playwright/test';
          import fs from 'node:fs';
          const base=process.env.BASE_URL||'http://127.0.0.1:4173/';
          fs.mkdirSync('test-results/software-low-budget',{recursive:true});
          const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
          try{
            const page=await browser.newPage({viewport:{width:844,height:390},isMobile:true,hasTouch:true});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            await page.goto(base,{waitUntil:'networkidle'});
            await page.waitForFunction(()=>window.__NEON_RACER__?.snapshot?.().version==='0.8.0');
            await page.click('#startGame');
            await page.waitForFunction(()=>window.__NEON_RACER__.snapshot().state==='running');
            const setup=await page.evaluate(()=>{
              const g=window.__NEON_RACER__.game;
              g.quality.apply({quality:'low',resolution:1,bloom:false,shadows:false});
              return {software:g.quality.softwareRenderer,rendererName:g.quality.rendererName,effective:g.quality.effective};
            });
            if(!setup.software||setup.effective!=='low')throw new Error(`Software LOW setup failed: ${JSON.stringify(setup)}`);
            await page.keyboard.down('KeyW');
            await page.keyboard.down('ShiftLeft');
            await page.waitForTimeout(1200);
            const samples=[];
            for(let i=0;i<30;i++){
              samples.push(await page.evaluate(()=>{
                const g=window.__NEON_RACER__.game,s=window.__NEON_RACER__.snapshot();
                return {calls:g.renderer.info.render.calls,triangles:g.renderer.info.render.triangles,speedKmh:s.speedKmh,position:s.position,effective:g.quality.effective};
              }));
              await page.waitForTimeout(100);
            }
            await page.keyboard.up('ShiftLeft');
            await page.keyboard.up('KeyW');
            const result={setup,maxCalls:Math.max(...samples.map(s=>s.calls)),maxTriangles:Math.max(...samples.map(s=>s.triangles)),samples};
            fs.writeFileSync('test-results/software-low-budget/active-budget.json',JSON.stringify(result,null,2));
            await page.screenshot({path:'test-results/software-low-budget/mobile-driving.png',animations:'disabled'});
            if(errors.length)throw new Error(errors.join('\n'));
            if(samples.some(s=>s.effective!=='low'))throw new Error(`Software LOW quality changed during sampling: ${JSON.stringify(result)}`);
            if(result.maxCalls>60||result.maxTriangles>110000)throw new Error(`Software LOW active render budget exceeded: ${JSON.stringify({maxCalls:result.maxCalls,maxTriangles:result.maxTriangles})}`);
            console.log(`Software LOW budget PASS · max ${result.maxCalls} calls · ${result.maxTriangles} triangles`);
          }finally{await browser.close()}
          EOF

      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/car-v080-software-vite.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/car-v080-software-vite.log
          exit 1

      - name: Software LOW active render budget
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: node tests/software-low-active-budget.tmp.mjs

      - name: Upload software LOW budget evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v080-software-low-budget-76e9378
          path: test-results/software-low-budget/
          if-no-files-found: ignore
          retention-days: 14
