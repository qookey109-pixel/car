name: V0.8.0 Validated 201b9f Preview

on:
  push:
    branches:
      - preview/v0.8.0-validated-201b9f
    paths:
      - .github/workflows/v080-validated-201b9f-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: v080-validated-201b9f-preview
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preserved Safari stability root
        uses: actions/checkout@v6
        with:
          ref: aedf54c22e3f66c16cb4aa06a9dff4030bebbea1
          path: root-source
      - name: Checkout 76e9378 preview
        uses: actions/checkout@v6
        with:
          ref: 76e9378ce01941caabe68555d2c0f83055c6980b
          path: preview-76
      - name: Checkout f3cabc preview
        uses: actions/checkout@v6
        with:
          ref: f3cabcbd15d2b9118328b2774f9c08036dcd7b33
          path: preview-f3
      - name: Checkout exact validated headroom candidate
        uses: actions/checkout@v6
        with:
          ref: 201b9f721fe04fa9e4df040afa44aa363a60ed3b
          path: preview-201
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build all preserved previews
        run: |
          for dir in root-source preview-76 preview-f3 preview-201; do
            (cd "$dir" && npm install && npm run build)
          done
      - name: Assemble fixed preview site
        run: |
          mkdir -p site/v0.8.0-76e9378 site/v0.8.0-f3cabc site/v0.8.0-201b9f
          cp -R root-source/dist/. site/
          cp -R preview-76/dist/. site/v0.8.0-76e9378/
          cp -R preview-f3/dist/. site/v0.8.0-f3cabc/
          cp -R preview-201/dist/. site/v0.8.0-201b9f/
          printf '%s\n' '76e9378ce01941caabe68555d2c0f83055c6980b' > site/v0.8.0-76e9378/PREVIEW_SHA.txt
          printf '%s\n' 'f3cabcbd15d2b9118328b2774f9c08036dcd7b33' > site/v0.8.0-f3cabc/PREVIEW_SHA.txt
          printf '%s\n' '201b9f721fe04fa9e4df040afa44aa363a60ed3b' > site/v0.8.0-201b9f/PREVIEW_SHA.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: v080-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy preserved root and validated previews
        id: deployment
        uses: actions/deploy-pages@v4
