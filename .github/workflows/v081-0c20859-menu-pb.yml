name: V0.8.1 0c20859 Menu PB Preview

on:
  push:
    branches: [preview/v0.8.1-menu-pb-0c20859]
    paths: [.github/workflows/v081-0c20859-menu-pb.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: car-fixed-preview-publication
  cancel-in-progress: false

jobs:
  webkit-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    env:
      BROWSER: webkit
      HOME: /root
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 0c20859a29b3c9d278a2fe9799dad31f32dbca78
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Static smoke
        run: npm test
      - name: Production build
        run: npm run build
      - name: Start exact candidate preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/car-v081-webkit.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/car-v081-webkit.log
          exit 1
      - name: Browser play smoke
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: npm run test:browser
      - name: Steering direction and reverse contract
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: node tests/control-direction-smoke.mjs
      - name: City atmosphere runtime acceptance
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: node tests/city-atmosphere-smoke.mjs
      - name: District awareness acceptance
        run: node tests/district-awareness-smoke.mjs
      - name: High-speed camera feel acceptance
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: node tests/camera-feel-smoke.mjs
      - name: Speed-flow and particle-color acceptance
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: node tests/vfx-speed-smoke.mjs
      - name: Objective compass acceptance
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: node tests/objective-compass-smoke.mjs
      - name: Checkpoint feedback acceptance
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: node tests/checkpoint-feedback-smoke.mjs
      - name: Stage transition acceptance
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: node tests/stage-transition-smoke.mjs
      - name: Replay momentum acceptance
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: node tests/replay-momentum-smoke.mjs
      - name: Audio feel acceptance
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: node tests/audio-feel-smoke.mjs
      - name: Upload WebKit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v081-0c20859-webkit-qa
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: webkit-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: v080-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 0c20859a29b3c9d278a2fe9799dad31f32dbca78
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build exact candidate
        working-directory: candidate
        run: npm install && npm test && npm run build
      - name: Mirror currently deployed immutable Pages bytes
        run: |
          python - <<'PY'
          import hashlib, json, re, urllib.request
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          base='https://qookey109-pixel.github.io/car/'
          previews=[
            'v0.8.0-76e9378','v0.8.0-f3cabc','v0.8.0-201b9f',
            'v0.8.1-0ae655','v0.8.1-74f1ce','v0.8.1-fa8e820','v0.8.1-db3b102',
            'v0.8.1-0f7585b','v0.8.1-aa74ae8','v0.8.1-6b3dc5f','v0.8.1-b91adb9',
            'v0.8.1-7aac4c3','v0.8.1-85eebfd','v0.8.1-16ac817','v0.8.1-7d936b2',
            'v0.8.1-a357e98','v0.8.1-2865bf3','v0.8.1-91c615f','v0.8.1-caae89a',
            'v0.8.1-d533c35','v0.8.1-aa01a44'
          ]
          root=Path('site'); root.mkdir()
          def get(url):
            req=urllib.request.Request(url,headers={'User-Agent':'car-preview-preserver','Cache-Control':'no-cache'})
            with urllib.request.urlopen(req,timeout=30) as r:
              if r.status!=200: raise RuntimeError(f'{r.status} {url}')
              return r.read()
          def write(rel,data):
            p=root/rel; p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(data)
          def mirror_index(prefix):
            index_rel=f'{prefix}/index.html' if prefix else 'index.html'
            index_url=urljoin(base,index_rel)
            data=get(index_url); write(index_rel,data)
            html=data.decode('utf-8')
            for link in re.findall(r'(?:src|href)=["\']([^"\']+)["\']',html):
              if not ('.js' in link or '.css' in link): continue
              u=urljoin(index_url,link)
              path=urlparse(u).path
              marker='/car/'
              if marker not in path: continue
              rel=path.split(marker,1)[1]
              write(rel,get(u))
          mirror_index('')
          for prefix in previews:
            mirror_index(prefix)
            marker=get(urljoin(base,f'{prefix}/PREVIEW_SHA.txt'))
            short=prefix.rsplit('-',1)[-1]
            full=marker.decode().strip()
            assert re.fullmatch(r'[0-9a-f]{40}',full), (prefix,full)
            assert full.startswith(short), (prefix,full)
            write(f'{prefix}/PREVIEW_SHA.txt',marker)
          hashes={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          Path('preserved-hashes.json').write_text(json.dumps(hashes,sort_keys=True))
          print(f'Mirrored and locked {len(hashes)} currently deployed files')
          PY
      - name: Append menu PB preview without changing preserved bytes
        run: |
          test ! -e site/v0.8.1-0c20859
          mkdir site/v0.8.1-0c20859
          cp -R candidate/dist/. site/v0.8.1-0c20859/
          printf '%s\n' '0c20859a29b3c9d278a2fe9799dad31f32dbca78' > site/v0.8.1-0c20859/PREVIEW_SHA.txt
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          hashes=json.loads(Path('preserved-hashes.json').read_text())
          for name,digest in hashes.items():
              got=hashlib.sha256((Path('site')/name).read_bytes()).hexdigest()
              assert got==digest,(name,digest,got)
          marker=Path('site/v0.8.1-0c20859/PREVIEW_SHA.txt').read_text().strip()
          assert marker=='0c20859a29b3c9d278a2fe9799dad31f32dbca78'
          print(f'Preserved all {len(hashes)} previous files byte-for-byte; appended 0c20859 only')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy preserved root and fixed previews
        id: deployment
        uses: actions/deploy-pages@v4
