<html lang="zh-Hant">

<title>Car — Real World Road V0.3</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1119;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}canvas{display:block}
#hud{position:fixed;z-index:5;left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));max-width:min(560px,calc(100vw - 20px));padding:12px 13px;border-radius:15px;background:rgba(4,8,13,.69);backdrop-filter:blur(12px);box-shadow:0 8px 30px rgba(0,0,0,.28)}
#hud h1{font-size:15px;margin:0 0 8px}.row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}#hud input{width:108px;padding:8px;border-radius:8px;border:1px solid #3b4352;background:#151922;color:#fff}#hud button{padding:8px 10px;border:0;border-radius:8px;background:#fff;color:#111;font-weight:800;cursor:pointer}
#status{font-size:12px;opacity:.94;margin-top:8px;line-height:1.45}#telemetry{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px;font-size:11px}.chip{padding:5px 8px;border:1px solid rgba(255,255,255,.12);border-radius:999px;background:rgba(255,255,255,.07)}.chip.good{border-color:rgba(67,255,191,.35);color:#8affd6}.chip.warn{border-color:rgba(255,204,74,.38);color:#ffe17b}.chip.bad{border-color:rgba(255,91,91,.42);color:#ff9d9d}#help{font-size:11px;opacity:.7;margin-top:6px}
#nitroWrap{position:fixed;z-index:6;right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));width:156px;padding:10px 11px;border-radius:14px;background:rgba(4,8,13,.62);backdrop-filter:blur(10px)}#nitroWrap .label{display:flex;justify-content:space-between;font-size:10px;font-weight:800;letter-spacing:.7px;margin-bottom:6px}#nitroTrack{height:7px;background:rgba(255,255,255,.12);border-radius:999px;overflow:hidden}#nitroFill{height:100%;width:100%;background:linear-gradient(90deg,#2a8cff,#55deff);border-radius:inherit;transition:width .08s linear}
#touch{position:fixed;z-index:7;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;padding:0 max(14px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left));pointer-events:none}.pad,.actions{pointer-events:auto}.pad{display:grid;grid-template-columns:repeat(2,64px);gap:10px}.actions{display:grid;grid-template-columns:repeat(2,70px);grid-template-rows:repeat(2,58px);gap:9px}.pad button,.actions button{border:1px solid rgba(255,255,255,.26);border-radius:17px;background:rgba(17,22,31,.72);color:#fff;font-weight:900;touch-action:none;-webkit-tap-highlight-color:transparent;backdrop-filter:blur(8px)}.pad button{height:94px;font-size:27px}.actions button{font-size:12px;letter-spacing:.5px}.actions .gas{border-color:rgba(83,255,213,.42);color:#92ffe4}.actions .brake{border-color:rgba(255,104,104,.42);color:#ffaaaa}.actions .drift{border-color:rgba(255,205,68,.48);color:#ffe172}.actions .nitro{border-color:rgba(56,175,255,.55);color:#7fd1ff}.pad button.active,.actions button.active,.pad button:active,.actions button:active{transform:scale(.95);filter:brightness(1.2)}
#impact{position:fixed;inset:0;z-index:4;pointer-events:none;border:0 solid rgba(255,80,70,0);transition:border-color .08s}#impact.hit{border:10px solid rgba(255,80,70,.25)}
#loading{position:fixed;z-index:20;inset:0;display:none;place-items:center;background:rgba(4,7,11,.5);font-size:17px;font-weight:800;backdrop-filter:blur(4px)}#loading.show{display:grid}
@media (hover:hover) and (pointer:fine){#touch{opacity:.35}.pad button,.actions button{cursor:pointer}}
@media (max-width:760px){#hud{max-width:calc(100vw - 20px);padding:10px}#hud h1{font-size:13px}#help{display:none}#nitroWrap{top:auto;bottom:calc(13px + env(safe-area-inset-bottom));right:50%;transform:translateX(50%);width:130px}.pad{grid-template-columns:repeat(2,56px)}.pad button{width:56px;height:78px}.actions{grid-template-columns:repeat(2,60px);grid-template-rows:repeat(2,50px)}.actions button{font-size:10px}}
</style>
</head>
<body>
<div id="hud">
  <h1>🌏 Real World Road V0.3</h1>
  <div class="row">
    <label>Lat <input id="lat" value="25.033964" inputmode="decimal"></label>
    <label>Lon <input id="lon" value="121.564468" inputmode="decimal"></label>
    <button id="load">載入道路</button>
  </div>
  <div id="status">預設：台北 101 周邊 1.2 km。</div>
  <div id="telemetry">
    <span class="chip" id="speed">0 km/h</span>
    <span class="chip good" id="surface">道路</span>
    <span class="chip" id="roadDistance">中心線 -- m</span>
    <span class="chip" id="slip">滑移 0°</span>
    <span class="chip" id="assist">貼路輔助</span>
    <span class="chip" id="collision">邊界正常</span>
  </div>
  <div id="help">WASD / 方向鍵｜Space 漂移｜Shift / N 氮氣。V0.3：道路邊界碰撞、路口鋪面、護欄與貼路手感；不做交通規則。</div>
</div>

<div id="nitroWrap"><div class="label"><span>N₂O</span><span id="nitroText">100%</span></div><div id="nitroTrack"><div id="nitroFill"></div></div></div>
<div id="touch">
  <div class="pad"><button data-action="left">◀</button><button data-action="right">▶</button></div>
  <div class="actions">
    <button class="drift" data-action="drift">DRIFT</button><button class="nitro" data-action="nitro">N₂O</button>
    <button class="brake" data-action="brake">BRAKE</button><button class="gas" data-action="gas">GAS</button>
  </div>
</div>
<div id="impact"></div><div id="loading">正在載入 OpenStreetMap 道路…</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js';

const RADIUS_METERS=1200, GRID_SIZE=80, MAX_SEGMENTS=9000, MAX_MARKINGS=18000, MAX_GUARDRAILS=12000, MAX_JUNCTIONS=1400;
const DRIVABLE=new Set(['motorway','motorway_link','trunk','trunk_link','primary','primary_link','secondary','secondary_link','tertiary','tertiary_link','unclassified','residential','living_street','service','road']);
const GUARDED=new Set(['motorway','motorway_link','trunk','trunk_link','primary','primary_link']);
const clamp=THREE.MathUtils.clamp;

const scene=new THREE.Scene();scene.background=new THREE.Color(0x9db7ca);scene.fog=new THREE.Fog(0x9db7ca,420,1600);
const camera=new THREE.PerspectiveCamera(59,innerWidth/innerHeight,.1,3200);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xeaf6ff,0x4a5a42,2.15));const sun=new THREE.DirectionalLight(0xffffff,1.45);sun.position.set(-180,320,120);scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(3200,3200),new THREE.MeshLambertMaterial({color:0x789167}));ground.rotation.x=-Math.PI/2;ground.position.y=-.055;scene.add(ground);
const roadGroup=new THREE.Group();scene.add(roadGroup);

const car=new THREE.Group();
const body=new THREE.Mesh(new THREE.BoxGeometry(2.15,.64,4.35),new THREE.MeshStandardMaterial({color:0xff4c2f,roughness:.5,metalness:.08}));body.position.y=.72;car.add(body);
const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.7,.57,1.9),new THREE.MeshStandardMaterial({color:0x172433,roughness:.22,metalness:.14}));cabin.position.set(0,1.21,-.18);car.add(cabin);
for(const x of[-.93,.93])for(const z of[-1.42,1.42]){const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.41,.41,.25,16),new THREE.MeshStandardMaterial({color:0x151515,roughness:.85}));wheel.rotation.z=Math.PI/2;wheel.position.set(x,.43,z);car.add(wheel)}scene.add(car);

const input={left:false,right:false,gas:false,brake:false,drift:false,nitro:false},keys=new Set();
const keyMap=new Map([['ArrowLeft','left'],['KeyA','left'],['ArrowRight','right'],['KeyD','right'],['ArrowUp','gas'],['KeyW','gas'],['ArrowDown','brake'],['KeyS','brake'],['Space','drift'],['ShiftLeft','nitro'],['ShiftRight','nitro'],['KeyN','nitro']]);
function syncInput(){for(const a of Object.keys(input))input[a]=false;for(const c of keys){const a=keyMap.get(c);if(a)input[a]=true}for(const b of document.querySelectorAll('[data-action].active'))input[b.dataset.action]=true}
addEventListener('keydown',e=>{if(keyMap.has(e.code)){e.preventDefault();keys.add(e.code);syncInput()}});
addEventListener('keyup',e=>{if(keyMap.has(e.code)){e.preventDefault();keys.delete(e.code);syncInput()}});
addEventListener('blur',()=>{keys.clear();document.querySelectorAll('[data-action]').forEach(b=>b.classList.remove('active'));syncInput()});
document.querySelectorAll('[data-action]').forEach(btn=>{const on=e=>{e.preventDefault();btn.setPointerCapture?.(e.pointerId);btn.classList.add('active');syncInput()},off=e=>{e.preventDefault();btn.classList.remove('active');syncInput()};btn.addEventListener('pointerdown',on);btn.addEventListener('pointerup',off);btn.addEventListener('pointercancel',off);btn.addEventListener('lostpointercapture',off)});

let mapOrigin={lat:25.033964,lon:121.564468},roadWayCount=0,roadSegments=[],roadGrid=new Map(),junctions=[],junctionGrid=new Map();
let roadMesh=null,markingMesh=null,junctionMesh=null,guardrailMesh=null;
const vehicle={heading:0,steer:0,velocity:new THREE.Vector2(),nitroCharge:1,nitroActive:false,surface:'road',boundaryHit:0,roadAssist:0};

const $=id=>document.getElementById(id),status=$('status'),loading=$('loading'),speedEl=$('speed'),surfaceEl=$('surface'),roadDistanceEl=$('roadDistance'),slipEl=$('slip'),assistEl=$('assist'),collisionEl=$('collision'),nitroFill=$('nitroFill'),nitroText=$('nitroText'),impactEl=$('impact');

function llToLocal(lat,lon){const latRad=mapOrigin.lat*Math.PI/180;return new THREE.Vector2((lon-mapOrigin.lon)*111320*Math.cos(latRad),-(lat-mapOrigin.lat)*111320)}
function inferredLanes(tags={}){const p=Number.parseInt(String(tags.lanes||''),10);if(Number.isFinite(p)&&p>0)return clamp(p,1,8);const t=tags.highway||'';if(['motorway','trunk'].includes(t))return 4;if(['primary','secondary'].includes(t))return 2;return 2}
function highwayWidth(tags={}){const lanes=inferredLanes(tags),type=tags.highway||'',laneWidth=['motorway','trunk','primary'].includes(type)?3.45:3.15,minimum=({motorway:11,trunk:10,primary:8,secondary:7,tertiary:6,residential:5.7,service:4.2,living_street:4.5}[type]||5.2);return Math.max(minimum,lanes*laneWidth)}
function isDrivableWay(way){const t=way.tags||{};if(!DRIVABLE.has(t.highway))return false;if(t.motor_vehicle==='no'||t.motorcar==='no')return false;if(t.access==='no'||t.access==='private')return false;return Array.isArray(way.nodes)&&way.nodes.length>=2}
function clearRoads(){roadGroup.clear();for(const mesh of[roadMesh,markingMesh,junctionMesh,guardrailMesh]){mesh?.geometry.dispose();mesh?.material.dispose()}roadMesh=markingMesh=junctionMesh=guardrailMesh=null;roadSegments=[];junctions=[];roadGrid=new Map();junctionGrid=new Map();roadWayCount=0}
function gridKey(ix,iz){return `${ix},${iz}`}
function pushGrid(grid,key,item){if(!grid.has(key))grid.set(key,[]);grid.get(key).push(item)}
function indexSegment(s){const margin=s.width*.5+5,minX=Math.floor((Math.min(s.ax,s.bx)-margin)/GRID_SIZE),maxX=Math.floor((Math.max(s.ax,s.bx)+margin)/GRID_SIZE),minZ=Math.floor((Math.min(s.az,s.bz)-margin)/GRID_SIZE),maxZ=Math.floor((Math.max(s.az,s.bz)+margin)/GRID_SIZE);for(let ix=minX;ix<=maxX;ix++)for(let iz=minZ;iz<=maxZ;iz++)pushGrid(roadGrid,gridKey(ix,iz),s)}
function indexJunction(j){const r=j.radius+2,minX=Math.floor((j.x-r)/GRID_SIZE),maxX=Math.floor((j.x+r)/GRID_SIZE),minZ=Math.floor((j.z-r)/GRID_SIZE),maxZ=Math.floor((j.z+r)/GRID_SIZE);for(let ix=minX;ix<=maxX;ix++)for(let iz=minZ;iz<=maxZ;iz++)pushGrid(junctionGrid,gridKey(ix,iz),j)}
function segmentNearest(px,pz,s){const vx=s.bx-s.ax,vz=s.bz-s.az,lenSq=vx*vx+vz*vz||1,t=clamp(((px-s.ax)*vx+(pz-s.az)*vz)/lenSq,0,1),x=s.ax+vx*t,z=s.az+vz*t,dx=px-x,dz=pz-z;return{distance:Math.hypot(dx,dz),x,z,t,segment:s}}
function nearby(grid,px,pz,radiusCells=2){const ix=Math.floor(px/GRID_SIZE),iz=Math.floor(pz/GRID_SIZE),out=[];for(let r=0;r<=radiusCells&&out.length===0;r++)for(let x=ix-r;x<=ix+r;x++)for(let z=iz-r;z<=iz+r;z++){const list=grid.get(gridKey(x,z));if(list)out.push(...list)}return out}
function nearestRoad(px,pz){const candidates=nearby(roadGrid,px,pz,3);if(!candidates.length)return null;let best=null;const seen=new Set();for(const s of candidates){if(seen.has(s.id))continue;seen.add(s.id);const h=segmentNearest(px,pz,s);if(!best||h.distance<best.distance)best=h}return best}
function junctionAt(px,pz){const candidates=nearby(junctionGrid,px,pz,1);let best=null;for(const j of candidates){const d=Math.hypot(px-j.x,pz-j.z);if(d<=j.radius&&(!best||d<best.distance))best={...j,distance:d}}return best}
function laneOffsets(s){const{lanes,width,oneWay}=s,offsets=[];if(oneWay){for(let i=1;i<lanes;i++)offsets.push(-width/2+width*i/lanes)}else{offsets.push(0);if(lanes>=4){const w=width/lanes;for(let i=1;i<lanes/2;i++)offsets.push(i*w,-i*w)}}return offsets}
function normalizeAngle(a){while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a}
function segmentTravelAngle(s,currentHeading){const a=Math.atan2(s.bx-s.ax,s.bz-s.az),b=normalizeAngle(a+Math.PI);return Math.abs(normalizeAngle(currentHeading-a))<=Math.abs(normalizeAngle(currentHeading-b))?a:b}

function buildRoads(osm){
  clearRoads();
  const nodes=new Map(),nodeMeta=new Map();
  for(const e of osm.elements||[])if(e.type==='node')nodes.set(e.id,e);
  let id=0,waySerial=0;
  for(const way of osm.elements||[]){
    if(way.type!=='way'||!isDrivableWay(way))continue;
    const width=highwayWidth(way.tags),lanes=inferredLanes(way.tags),oneWay=['yes','1','true'].includes(String(way.tags?.oneway||'').toLowerCase())||way.tags?.junction==='roundabout';
    let added=false;
    for(let i=1;i<way.nodes.length&&roadSegments.length<MAX_SEGMENTS;i++){
      const aId=way.nodes[i-1],bId=way.nodes[i],na=nodes.get(aId),nb=nodes.get(bId);if(!na||!nb)continue;
      const a=llToLocal(na.lat,na.lon),b=llToLocal(nb.lat,nb.lon);if(a.distanceToSquared(b)<.04)continue;
      const s={id:id++,wayId:waySerial,aNode:aId,bNode:bId,ax:a.x,az:a.y,bx:b.x,bz:b.y,width,lanes,oneWay,highway:way.tags.highway,guarded:GUARDED.has(way.tags.highway),aJunction:0,bJunction:0};
      roadSegments.push(s);indexSegment(s);added=true;
      for(const [nid,p] of[[aId,a],[bId,b]]){if(!nodeMeta.has(nid))nodeMeta.set(nid,{x:p.x,z:p.y,segments:new Set(),ways:new Set(),maxWidth:width});const m=nodeMeta.get(nid);m.segments.add(s.id);m.ways.add(waySerial);m.maxWidth=Math.max(m.maxWidth,width)}
    }
    if(added){roadWayCount++;waySerial++}
  }

  for(const [nodeId,m] of nodeMeta){if(m.segments.size>=3||m.ways.size>=2&&m.segments.size>=3){const j={nodeId,x:m.x,z:m.z,radius:Math.min(18,Math.max(5,m.maxWidth*.62+1.8))};junctions.push(j);if(junctions.length>=MAX_JUNCTIONS)break}}
  const jByNode=new Map(junctions.map(j=>[j.nodeId,j]));
  for(const s of roadSegments){s.aJunction=jByNode.get(s.aNode)?.radius||0;s.bJunction=jByNode.get(s.bNode)?.radius||0}
  junctions.forEach(indexJunction);

  const matrix=new THREE.Matrix4(),pos=new THREE.Vector3(),scale=new THREE.Vector3(),quat=new THREE.Quaternion(),yAxis=new THREE.Vector3(0,1,0);
  const roadGeo=new THREE.BoxGeometry(1,.045,1),roadMat=new THREE.MeshLambertMaterial({color:0x34373b});
  roadMesh=new THREE.InstancedMesh(roadGeo,roadMat,roadSegments.length);roadMesh.frustumCulled=false;
  const marks=[],guards=[];
  for(let index=0;index<roadSegments.length;index++){
    const s=roadSegments[index],dx=s.bx-s.ax,dz=s.bz-s.az,len=Math.hypot(dx,dz),angle=Math.atan2(dx,dz),ux=dx/len,uz=dz/len,nx=-uz,nz=ux;
    pos.set((s.ax+s.bx)/2,.01,(s.az+s.bz)/2);quat.setFromAxisAngle(yAxis,angle);scale.set(s.width,1,len);matrix.compose(pos,quat,scale);roadMesh.setMatrixAt(index,matrix);
    for(const offset of laneOffsets(s))for(let d=4;d<len-1&&marks.length<MAX_MARKINGS;d+=9){const dashLen=Math.min(4,len-d);if(dashLen>.4)marks.push({x:s.ax+ux*(d+dashLen/2)+nx*offset,z:s.az+uz*(d+dashLen/2)+nz*offset,angle,len:dashLen})}
    if(s.guarded&&guards.length<MAX_GUARDRAILS){
      const trimA=Math.max(1.5,s.aJunction+1),trimB=Math.max(1.5,s.bJunction+1),usable=len-trimA-trimB;
      if(usable>5){const centerD=trimA+usable/2,edge=s.width/2+.55;for(const side of[-1,1])guards.push({x:s.ax+ux*centerD+nx*edge*side,z:s.az+uz*centerD+nz*edge*side,angle,len:usable})}
    }
  }
  roadMesh.instanceMatrix.needsUpdate=true;roadGroup.add(roadMesh);

  const markGeo=new THREE.BoxGeometry(.13,.025,1),markMat=new THREE.MeshBasicMaterial({color:0xf0eee3});
  markingMesh=new THREE.InstancedMesh(markGeo,markMat,marks.length);markingMesh.frustumCulled=false;
  marks.forEach((m,i)=>{pos.set(m.x,.05,m.z);quat.setFromAxisAngle(yAxis,m.angle);scale.set(1,1,m.len);matrix.compose(pos,quat,scale);markingMesh.setMatrixAt(i,matrix)});
  markingMesh.instanceMatrix.needsUpdate=true;roadGroup.add(markingMesh);

  const junctionGeo=new THREE.CylinderGeometry(1,1,.05,20),junctionMat=new THREE.MeshLambertMaterial({color:0x34373b});
  junctionMesh=new THREE.InstancedMesh(junctionGeo,junctionMat,junctions.length);junctionMesh.frustumCulled=false;
  junctions.forEach((j,i)=>{pos.set(j.x,.012,j.z);quat.identity();scale.set(j.radius,1,j.radius);matrix.compose(pos,quat,scale);junctionMesh.setMatrixAt(i,matrix)});
  junctionMesh.instanceMatrix.needsUpdate=true;roadGroup.add(junctionMesh);

  const guardGeo=new THREE.BoxGeometry(.12,.55,1),guardMat=new THREE.MeshStandardMaterial({color:0xb9c0c6,roughness:.6,metalness:.35});
  guardrailMesh=new THREE.InstancedMesh(guardGeo,guardMat,guards.length);guardrailMesh.frustumCulled=false;
  guards.forEach((g,i)=>{pos.set(g.x,.31,g.z);quat.setFromAxisAngle(yAxis,g.angle);scale.set(1,1,g.len);matrix.compose(pos,quat,scale);guardrailMesh.setMatrixAt(i,matrix)});
  guardrailMesh.instanceMatrix.needsUpdate=true;roadGroup.add(guardrailMesh);
  return{segmentCount:roadSegments.length,markingCount:marks.length,guardrailCount:guards.length,junctionCount:junctions.length}
}

function spawnOnRoad(){const hit=nearestRoad(0,0);vehicle.velocity.set(0,0);vehicle.steer=0;vehicle.nitroCharge=1;vehicle.nitroActive=false;vehicle.boundaryHit=0;if(!hit){car.position.set(0,0,0);vehicle.heading=0;return}car.position.set(hit.x,0,hit.z);vehicle.heading=segmentTravelAngle(hit.segment,0);car.rotation.y=vehicle.heading}
async function fetchOverpass(query){const endpoints=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'];let lastError=null;for(const endpoint of endpoints){try{const res=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:'data='+encodeURIComponent(query)});if(!res.ok)throw new Error(`${endpoint} HTTP ${res.status}`);return await res.json()}catch(err){lastError=err}}throw lastError||new Error('Overpass unavailable')}
async function loadRoads(){const lat=Number($('lat').value),lon=Number($('lon').value);if(!Number.isFinite(lat)||!Number.isFinite(lon)){status.textContent='⚠️ 請輸入有效的 Lat / Lon。';return}mapOrigin={lat,lon};loading.classList.add('show');status.textContent='正在抓取可駕駛道路…';const query=`[out:json][timeout:28];way[highway](around:${RADIUS_METERS},${lat},${lon});(._;>;);out body;`;try{const osm=await fetchOverpass(query),built=buildRoads(osm);spawnOnRoad();status.innerHTML=`✅ ${roadWayCount} ways｜${built.segmentCount} segments｜${built.junctionCount} 路口｜${built.guardrailCount} 護欄段｜${built.markingCount} 標線`}catch(err){console.error(err);status.textContent=`⚠️ 道路載入失敗：${String(err?.message||err)}`}finally{loading.classList.remove('show')}}
$('load').addEventListener('click',loadRoads);

const clock=new THREE.Clock(),camTarget=new THREE.Vector3(),forward2=new THREE.Vector2(),desiredVel=new THREE.Vector2(),tmpOut=new THREE.Vector2();
function applyRoadAssist(dt,hit,currentSpeed,driftActive){
  vehicle.roadAssist=0;if(!hit||driftActive||Math.abs(vehicle.steer)>.24||currentSpeed<7)return;
  const edge=hit.distance-hit.segment.width*.5;if(edge>.8)return;
  const target=segmentTravelAngle(hit.segment,vehicle.heading),delta=normalizeAngle(target-vehicle.heading);
  const strength=clamp((currentSpeed-7)/25,0,.72)*.7;
  vehicle.heading+=delta*strength*dt;vehicle.roadAssist=Math.abs(delta)*180/Math.PI;
}
function applyGuardrailCollision(hit){
