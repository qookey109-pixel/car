<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Car — Real World Road V0.1</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b10;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    canvas{display:block}
    #hud{position:fixed;z-index:5;left:12px;top:12px;max-width:min(440px,calc(100vw - 24px));padding:12px;border-radius:14px;background:rgba(0,0,0,.58);backdrop-filter:blur(10px);box-shadow:0 8px 30px rgba(0,0,0,.25)}
    #hud h1{font-size:15px;margin:0 0 8px}
    #hud .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    #hud input{width:108px;padding:8px;border-radius:8px;border:1px solid #3b4352;background:#151922;color:#fff}
    #hud button{padding:8px 10px;border:0;border-radius:8px;background:#fff;color:#111;font-weight:700;cursor:pointer}
    #status{font-size:12px;opacity:.9;margin-top:8px;line-height:1.45}
    #help{font-size:11px;opacity:.72;margin-top:6px}
    #speed{font-variant-numeric:tabular-nums}
    #touch{position:fixed;z-index:6;left:0;right:0;bottom:14px;display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}
    .pad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,54px);gap:8px;pointer-events:auto}
    .pad button{border:0;border-radius:16px;background:rgba(20,24,31,.72);color:white;font-size:22px;touch-action:none;user-select:none;-webkit-user-select:none}
    .pad .empty{visibility:hidden}
    @media (hover:hover) and (pointer:fine){#touch{display:none}}
  </style>
</head>
<body>
  <div id="hud">
    <h1>🌏 Real World Road V0.1</h1>
    <div class="row">
      <label>Lat <input id="lat" value="25.033964" inputmode="decimal"></label>
      <label>Lon <input id="lon" value="121.564468" inputmode="decimal"></label>
      <button id="load">載入道路</button>
    </div>
    <div id="status">預設：台北 101 周邊。<span id="speed">0 km/h</span></div>
    <div id="help">WASD / 方向鍵駕駛。道路來自 OpenStreetMap / Overpass；此版本只驗證真實路網 → 3D → 可駕駛。</div>
  </div>

  <div id="touch">
    <div class="pad">
      <button class="empty"></button><button data-key="ArrowUp">▲</button><button class="empty"></button>
      <button data-key="ArrowLeft">◀</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9db7ca);
    scene.fog = new THREE.Fog(0x9db7ca, 350, 1450);

    const camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, 0.1, 3000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.6));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = false;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xeaf6ff, 0x4a5a42, 2.1));
    const sun = new THREE.DirectionalLight(0xffffff, 1.5);
    sun.position.set(-200, 300, 120);
    scene.add(sun);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(2800, 2800),
      new THREE.MeshLambertMaterial({ color: 0x789167 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.03;
    scene.add(ground);

    const roadGroup = new THREE.Group();
    scene.add(roadGroup);

    const car = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.65, 4.4), new THREE.MeshStandardMaterial({ color: 0xff4c2f, roughness: .5 }));
    body.position.y = .72;
    car.add(body);
    const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.75, .58, 1.9), new THREE.MeshStandardMaterial({ color: 0x172433, roughness: .25 }));
    cabin.position.set(0,1.22,-.15);
    car.add(cabin);
    for (const x of [-.94,.94]) for (const z of [-1.42,1.42]) {
      const wheel = new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.26,16), new THREE.MeshStandardMaterial({color:0x151515}));
      wheel.rotation.z = Math.PI/2; wheel.position.set(x,.43,z); car.add(wheel);
    }
    scene.add(car);

    const keys = Object.create(null);
    addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
    document.querySelectorAll('[data-key]').forEach(btn => {
      const k = btn.dataset.key.toLowerCase();
      const on = e => { e.preventDefault(); keys[k] = true; };
      const off = e => { e.preventDefault(); keys[k] = false; };
      btn.addEventListener('pointerdown', on); btn.addEventListener('pointerup', off); btn.addEventListener('pointercancel', off); btn.addEventListener('pointerleave', off);
    });

    let speed = 0;
    let heading = 0;
    let mapOrigin = { lat: 25.033964, lon: 121.564468 };
    let roadCount = 0;

    const status = document.getElementById('status');
    const speedEl = document.getElementById('speed');

    function llToLocal(lat, lon) {
      const latRad = mapOrigin.lat * Math.PI / 180;
      const metersPerDegLat = 111320;
      const metersPerDegLon = 111320 * Math.cos(latRad);
      return new THREE.Vector2((lon - mapOrigin.lon) * metersPerDegLon, -(lat - mapOrigin.lat) * metersPerDegLat);
    }

    function clearRoads() {
      while (roadGroup.children.length) {
        const obj = roadGroup.children.pop();
        obj.geometry?.dispose(); obj.material?.dispose();
      }
      roadCount = 0;
    }

    function highwayWidth(tags={}) {
      const lanes = Math.max(1, Number.parseInt(tags.lanes || '0', 10) || 0);
      const type = tags.highway || '';
      const base = ({motorway:10,trunk:9,primary:8,secondary:7,tertiary:6,residential:5,service:3.5,living_street:4}[type] || 4.5);
      return Math.max(base, lanes * 3.0);
    }

    function addRoadSegment(a, b, width) {
      const dx = b.x-a.x, dz = b.y-a.y;
      const len = Math.hypot(dx,dz); if (len < .15) return;
      const nx = -dz/len * width/2, nz = dx/len * width/2;
      const y = .025;
      const positions = new Float32Array([
        a.x+nx,y,a.y+nz, a.x-nx,y,a.y-nz, b.x-nx,y,b.y-nz,
        a.x+nx,y,a.y+nz, b.x-nx,y,b.y-nz, b.x+nx,y,b.y+nz
      ]);
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions,3));
      geo.computeVertexNormals();
      const mesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({color:0x34373b}));
      roadGroup.add(mesh);
    }

    function buildRoads(osm) {
      clearRoads();
      const nodes = new Map();
      for (const e of osm.elements || []) if (e.type === 'node') nodes.set(e.id, e);
      for (const way of osm.elements || []) {
        if (way.type !== 'way' || !way.tags?.highway || !Array.isArray(way.nodes)) continue;
        const width = highwayWidth(way.tags);
        for (let i=1;i<way.nodes.length;i++) {
          const na = nodes.get(way.nodes[i-1]), nb = nodes.get(way.nodes[i]);
          if (!na || !nb) continue;
          addRoadSegment(llToLocal(na.lat,na.lon), llToLocal(nb.lat,nb.lon), width);
        }
        roadCount++;
      }
    }

    async function loadRoads() {
      const lat = Number(document.getElementById('lat').value);
      const lon = Number(document.getElementById('lon').value);
      if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;
      mapOrigin = {lat,lon};
      status.textContent = '正在從 OpenStreetMap / Overpass 載入道路…';
      const radius = 1200;
      const query = `[out:json][timeout:25];way[highway](around:${radius},${lat},${lon});(._;>;);out body;`;
      try {
        const res = await fetch('https://overpass-api.de/api/interpreter', {
          method:'POST',
          headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},
          body:'data='+encodeURIComponent(query)
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const osm = await res.json();
        buildRoads(osm);
        car.position.set(0,0,0); speed=0; heading=0;
        status.innerHTML = `✅ 已載入 <b>${roadCount}</b> 條 OSM ways｜<span id="speed">0 km/h</span>`;
        window.speedEl = document.getElementById('speed');
      } catch (err) {
        console.error(err);
        status.innerHTML = `⚠️ Overpass 載入失敗：${String(err.message || err)}。請用本機 HTTP server / GitHub Pages 開啟後重試。`;
      }
    }

    document.getElementById('load').addEventListener('click', loadRoads);

    const clock = new THREE.Clock();
    const camTarget = new THREE.Vector3();
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), .04);
      const forward = keys['w'] || keys['arrowup'];
      const brake = keys['s'] || keys['arrowdown'];
      const left = keys['a'] || keys['arrowleft'];
      const right = keys['d'] || keys['arrowright'];

      const accel = forward ? 18 : 0;
      speed += accel * dt;
      if (brake) speed -= 28 * dt;
      speed *= Math.pow(.985, dt*60);
      speed = THREE.MathUtils.clamp(speed, -8, 42);
      const steer = (left?1:0) - (right?1:0);
      const steerScale = THREE.MathUtils.clamp(Math.abs(speed)/9,0,1);
      heading += steer * steerScale * 1.65 * dt * (speed >= 0 ? 1 : -1);

      car.rotation.y = heading;
      car.position.x += Math.sin(heading) * speed * dt;
      car.position.z += Math.cos(heading) * speed * dt;

      const follow = new THREE.Vector3(-Math.sin(heading)*10, 5.4, -Math.cos(heading)*10).add(car.position);
      camera.position.lerp(follow, 1 - Math.pow(.001, dt));
      camTarget.set(car.position.x,1.0,car.position.z);
      camera.lookAt(camTarget);

      const el = document.getElementById('speed');
      if (el) el.textContent = `${Math.round(Math.abs(speed)*3.6)} km/h`;
      renderer.render(scene,camera);
    }

    addEventListener('resize', () => {
      camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(innerWidth,innerHeight);
    });

    camera.position.set(0,5,-10);
    animate();
    loadRoads();
  </script>
</body>
</html>
